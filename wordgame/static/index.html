<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Word Families Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#11182e;--ink:#e8ecf4;--muted:#7a869a;--accent:#00d4aa;--accent2:#ffd600;--red:#ff4757;--blue:#4d96ff;--violet:#c77dff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:420px}
.card{background:var(--card);border:1px solid #1e2a4a;border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
h1{font-size:clamp(22px,6vw,32px);font-weight:800;text-align:center;margin:0 0 6px;letter-spacing:-0.5px}
h1 span{color:var(--accent)}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 24px}
.input-group{display:flex;flex-direction:column;gap:10px}
label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px}
input[type=text]{padding:16px 18px;border:2px solid #233050;border-radius:12px;font-size:18px;font-weight:700;background:#0a1128;color:var(--ink);text-align:center;letter-spacing:4px;text-transform:uppercase}
input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,170,.15)}
input[type=text]::placeholder{color:#3a4a6a;letter-spacing:2px}
.btn{width:100%;padding:16px 0;border:0;border-radius:12px;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,var(--accent),#00b896);color:#041a14;transition:.15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,212,170,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.error{color:var(--red);font-size:13px;text-align:center;min-height:18px;margin-top:8px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5}
.waiting{display:none;text-align:center;padding:20px}
.waiting.on{display:block}
.spinner{width:40px;height:40px;border:3px solid #233050;border-top-color:var(--accent);border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.waiting p{color:var(--muted);font-size:14px;margin:0}
.room-code{font-family:monospace;font-size:28px;font-weight:800;color:var(--accent2);letter-spacing:6px;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="joinCard">
    <h1>Word <span>Families</span></h1>
    <p class="sub">Unit 3E · Solutions Intermediate</p>
    <div class="input-group">
      <label>Room Code</label>
      <input type="text" id="roomInput" maxlength="4" placeholder="ABCD" autocomplete="off" spellcheck="false">
      <label>Your Name</label>
      <input type="text" id="nameInput" maxlength="20" placeholder="Nickname" autocomplete="off">
      <div class="error" id="err"></div>
      <button class="btn" id="joinBtn">Join Game</button>
    </div>
    <p class="hint">Enter the 4-letter code your teacher shows on screen.</p>
  </div>

  <div class="card waiting" id="waitCard">
    <div class="spinner"></div>
    <p>Waiting for teacher to start…</p>
    <div class="room-code" id="showCode"></div>
  </div>

  <div class="card waiting" id="gameCard">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="room-code" id="gCode"></div>
      <div style="font-size:13px;color:var(--muted)">Q <b id="qNum">1</b>/<span id="qTot">20</span></div>
    </div>
    <div style="background:#0a1128;border:1px solid #233050;border-radius:12px;padding:16px;margin-bottom:16px;min-height:80px">
      <div style="font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px" id="qCat"></div>
      <div style="font-size:20px;font-weight:700;line-height:1.3" id="qText"></div>
    </div>
    <div class="opts" id="opts" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
    <div style="margin-top:16px;padding:12px;background:#0a1128;border:1px solid #233050;border-radius:10px;text-align:center;color:var(--muted);font-size:13px" id="feedback" hidden></div>
  </div>

  <div class="card waiting" id="resultCard">
    <h2 style="text-align:center;margin:0 0 8px" id="finalRank"></h2>
    <p style="text-align:center;color:var(--muted);margin:0 0 16px" id="finalScore"></p>
    <div style="max-height:200px;overflow:auto" id="leaderboard"></div>
    <button class="btn" style="margin-top:16px" onclick="location.reload()">Play Again</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
